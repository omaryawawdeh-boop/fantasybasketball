<title>Hoops Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="hoops-draft-sync" content="1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column built for a phone held in one hand; a sticky top bar (status, undo, search),
   tier sections as stacked lists, row tools open in place under the tapped player. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel2:#f5f7f9; --ink:#14202c; --muted:#5b6876; --line:#d7dde4;
  --accent:#d9531b; --accent-ink:#ffffff; --accent-soft:#fbe6dc;
  --good:#16775c; --good-soft:#dcf1e9; --bad:#b3362c; --bad-soft:#f8e0dd; --dr:#6a3fb5; --dr-soft:#ece4fa;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#17202a; --panel2:#1d2833; --ink:#e7edf3; --muted:#93a1af; --line:#2a3744;
  --accent:#ff7a3d; --accent-ink:#1a0c05; --accent-soft:#3a2117;
  --good:#4fd1a8; --good-soft:#143229; --bad:#ff8579; --bad-soft:#3b1d1a; --dr:#bf9bff; --dr-soft:#2c2142; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#17202a; --panel2:#1d2833; --ink:#e7edf3; --muted:#93a1af; --line:#2a3744;
  --accent:#ff7a3d; --accent-ink:#1a0c05; --accent-soft:#3a2117;
  --good:#4fd1a8; --good-soft:#143229; --bad:#ff8579; --bad-soft:#3b1d1a; --dr:#bf9bff; --dr-soft:#2c2142; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.4 var(--body);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px}
h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
h1 span{color:var(--accent)}
.status{font-size:12px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status b{color:var(--good);font-weight:600}
.status.err b{color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 11px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45}
.search{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;font-size:16px}
.tier{margin-top:14px}
.th{display:flex;align-items:center;gap:8px;padding:6px 2px}
.tn{font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent);min-width:34px}
.tl{font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em;flex:1;min-width:0}
.tc{font-size:12px;color:var(--muted)}
.mini{border:1px solid var(--line);background:transparent;border-radius:7px;padding:3px 8px;font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.open{background:var(--panel2)}
.rk{min-width:42px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-variant-numeric:tabular-nums}
.who{flex:1;min-width:0}
.nm{font-weight:700;font-size:16px;line-height:1.2}
.sub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px;font-variant-numeric:tabular-nums}
.sub b{color:var(--ink);font-weight:600}
.b{font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:1px 5px;border-radius:4px;vertical-align:2px;margin-left:3px}
.b-dr{background:var(--dr-soft);color:var(--dr)}.b-inj{background:var(--bad-soft);color:var(--bad)}.b-rk{background:var(--good-soft);color:var(--good)}
.more{width:40px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:18px;line-height:1;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 12px;background:var(--panel2);border-top:1px dashed var(--line)}
.tools .grp{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.tools input{width:72px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--panel);font-size:16px}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;font-weight:600;font-size:14px}
.tool.on.dr{background:var(--dr-soft);color:var(--dr);border-color:var(--dr)}
.tool.on.inj{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.tool.on.rk{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.tool.danger{color:var(--bad)}
.tool.confirm{background:var(--bad);color:#fff;border-color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px;display:flex;flex-direction:column;gap:8px}
.card h2{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.addrow{display:flex;gap:6px}
.addrow input{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--panel2);font-size:16px;min-width:0}
.addrow input.name{flex:1}.addrow input.at{width:70px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--panel2);font-size:13px}
.empty{padding:28px 6px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.ro{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:8px 10px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="root">
  <div class="empty">Loading your board…</div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="names.js"></script>
<script src="rankings.js"></script>
<script src="rankings-edit.js"></script>
<script src="tier-sheet-stats.js"></script>
<script src="phone.js"></script>
