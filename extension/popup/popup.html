<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hoops Draft Assistant</title>
<style>
body{margin:0;width:280px;background:#101318;color:#e9ecf1;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px}
h1{font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}h1 span{color:#ff7a3d}
p{color:#8d95a3;margin:0 0 12px}
button{display:block;width:100%;margin-top:8px;background:#1d222b;border:1px solid #2a303b;color:#e9ecf1;border-radius:8px;padding:9px;font:inherit;font-weight:600;cursor:pointer;text-align:left}
button.primary{background:#ff7a3d;border-color:#ff7a3d;color:#1a0d06}
</style>
</head>
<body>
<h1><span>●</span> Draft Assistant</h1>
<p>Open your ESPN basketball draft room (mock or real) and the panel appears on the right. <b>Alt+Shift+D</b> shows/hides it.</p>
<button id="board" class="primary">Open manual draft board</button>
<button id="opts">My rankings &amp; settings</button>
<script src="popup.js"></script>
